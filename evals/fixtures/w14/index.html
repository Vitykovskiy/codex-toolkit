<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Синтетический список</title>
  <style>
    body { font: 16px system-ui; margin: 24px; }
    nav, main { max-width: 640px; margin-bottom: 24px; }
    button, a { padding: 10px; }
    .notice { padding: 16px; border: 1px solid #b22; }
    .floating { position: fixed; right: 16px; bottom: 16px; }
  </style>
</head>
<body>
  <nav aria-label="Основная навигация"><a href="#items">Список</a></nav>
  <main id="items">
    <h1>Список</h1>
    <div class="notice">
      <p id="status">INTERNAL_SERVER_ERROR</p>
      <button type="button" data-retry>Повторить</button>
      <p><button type="button" data-retry>Повторить</button></p>
    </div>
  </main>
  <a class="floating" href="#items">Список</a>
  <script>
    document.querySelectorAll('[data-retry]').forEach(button => {
      button.addEventListener('click', () => {
        document.getElementById('status').textContent = 'Готово';
      });
    });
  </script>
</body>
</html>
