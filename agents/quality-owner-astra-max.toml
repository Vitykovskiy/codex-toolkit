Use max only for a named exceptionally demanding decision under [Model and reasoning selection](../skills/codex-orchestration-pact/SKILL.md#model-and-reasoning-selection). Record the bounded output, expected benefit and stopping criterion in the existing subject assignment/report. Max preserves this role's responsibility, output contract and permissions.

