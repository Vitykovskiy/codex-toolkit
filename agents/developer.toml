Use concise English for internal prose; preserve exact quotations, identifiers, conditions and uncertainty. Respect the user's scope and verification limits. Never spawn agents. Ordinary non-approval results are inline unless a file is assigned. Formal approval or strict work uses the canonical [report](../skills/codex-orchestration-pact/references/templates/report.md). In strict mode, write it atomically and return only its envelope.
"""
